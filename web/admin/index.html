<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sparrow Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Sparrow admin: black-and-white tool chrome, colour only for status. Sidebar on wide screens, top tabs on phones. */
:root {
  --surface: #ffffff; --soft: #f4f4f4; --line: #e3e3e3; --ink: #0a0a0a; --muted: #6b6b6b; --faint: #8f8f8f;
  --fill: #0a0a0a; --on-fill: #ffffff; --hover: #fafafa;
  --ok: #1f7a3a; --ok-soft: #e8f3eb; --warn: #9a6700; --warn-soft: #fbf1dc; --bad: #b3261e; --bad-soft: #fbe9e7;
  --bubble-in: #ffffff; --bubble-out: #f0f0f0;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body: Geist, "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-sm: 8px; --r-lg: 14px; --r-full: 999px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --surface: #0b0b0b; --soft: #161616; --line: #2a2a2a; --ink: #f2f2f2; --muted: #9a9a9a; --faint: #777777;
  --fill: #f2f2f2; --on-fill: #0b0b0b; --hover: #121212;
  --ok: #6fd38e; --ok-soft: #12261a; --warn: #e8b64a; --warn-soft: #2a2110; --bad: #ff8a80; --bad-soft: #2c1512;
  --bubble-in: #161616; --bubble-out: #222222;
  color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--soft); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
a { color: var(--ink); text-underline-offset: 2px; }
.bird { width: 30px; height: auto; display: block; color: var(--ink); flex: none; }
.lbl, .facts dt, .kv dt, table.ins th, .field > .cap { font: 400 11px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* login */
.login { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; background: var(--surface); }
.login-card { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 16px; }
.login-card .brand { margin-bottom: 8px; }
.login-card h1 { font: 700 2.25rem/1.05 var(--display); letter-spacing: -.025em; margin: 0; }
.login-card .btn.primary { padding: 12px 18px; font-size: .9375rem; }
.field { display: flex; flex-direction: column; gap: 6px; font: 400 11px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea { font: 400 .9375rem/1.4 var(--body); letter-spacing: 0; text-transform: none; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 10px 12px; color: var(--ink); width: 100%; }
.field input[type="checkbox"] { width: 18px; height: 18px; padding: 0; margin: 0; flex: none; accent-color: var(--fill); }
.field.toggle { flex-direction: row; align-items: center; gap: 10px; cursor: pointer; font: 500 .9375rem/1.4 var(--body); letter-spacing: 0; text-transform: none; color: var(--ink); }
.field input:focus, .field select:focus, .field textarea:focus, .search:focus { outline: none; border-color: var(--ink); }
.field .sub, .field span.sub { font: 400 .8125rem var(--body); letter-spacing: 0; text-transform: none; }
.err { color: var(--bad); font-size: .8125rem; min-height: 1.2em; }

/* brand */
.brand { display: flex; align-items: center; gap: 10px; }
.wordmark { font: 800 26px/1 var(--display); letter-spacing: -.02em; margin: 0; }
.tagline { font: 400 11px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-top: 6px; }

/* shell: sidebar on wide screens */
.app { height: 100%; display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 0; }
.side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 24px; padding: 22px 14px 18px; min-height: 0; overflow-y: auto; }
.side .brand { padding: 0 8px; }
.tabs { display: flex; flex-direction: column; gap: 2px; }
.tab { border: 0; background: none; padding: 10px 12px; cursor: pointer; font-weight: 500; color: var(--muted); border-radius: var(--r-full); white-space: nowrap; display: flex; gap: 8px; align-items: center; text-align: left; width: 100%; }
.tab:hover { color: var(--ink); background: var(--soft); }
.tab[aria-selected="true"] { color: var(--on-fill); background: var(--fill); font-weight: 600; }
.badge { margin-left: auto; background: var(--bad); color: #fff; font: 600 11px/18px var(--body); border-radius: var(--r-full); padding: 0 7px; min-width: 20px; text-align: center; }
.tab[aria-selected="true"] .badge { background: var(--on-fill); color: var(--fill); }
.badge:empty { display: none; }
.who { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px 8px 0; border-top: 1px solid var(--line); font-size: .8125rem; color: var(--muted); min-width: 0; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .btn { align-self: flex-start; }
.view { min-height: 0; min-width: 0; overflow-y: auto; }

/* controls */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-full); padding: 8px 16px; cursor: pointer; font-weight: 600; font-size: .875rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink); white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--fill); color: var(--on-fill); border-color: var(--fill); }
.btn.primary:hover { opacity: .88; }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: default; }
.page { max-width: 1040px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.pagehead { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
.pagehead h2 { font: 700 2.25rem/1.05 var(--display); letter-spacing: -.025em; margin: 0; }
@media (max-width: 900px) { .pagehead h2 { font-size: 1.75rem; } }
.inhouse { display: flex; gap: 12px; align-items: flex-start; border-top: 1px solid var(--line); padding-top: 12px; cursor: pointer; }
.inhouse input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--fill); flex: none; }
.assignbox { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: var(--r-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.assignbox .lbl { color: var(--warn); }
.assignrow { display: flex; gap: 8px; flex-wrap: wrap; }
.assignrow select { flex: 1 1 240px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-full); padding: 9px 14px; color: var(--ink); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .grow { flex: 1; min-width: 200px; }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-full); padding: 10px 16px; color: var(--ink); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-full); padding: 7px 14px; font-size: .8125rem; font-weight: 500; cursor: pointer; color: var(--muted); }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--fill); border-color: var(--fill); color: var(--on-fill); font-weight: 600; }

/* cards and rows */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card > .title:first-child { font: 700 1.125rem/1.25 var(--display); letter-spacing: -.01em; }
.row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.row .grow { flex: 1; min-width: 0; }
.title { font-weight: 600; }
.title .mono { color: var(--muted); }
.sub { color: var(--muted); font-size: .8125rem; overflow-wrap: anywhere; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.thumbs a { display: block; aspect-ratio: 1 / 1; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--line); position: relative; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs span { position: absolute; left: 4px; bottom: 4px; background: rgba(0,0,0,.6); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; text-transform: uppercase; letter-spacing: .06em; }
.mono { font-family: var(--mono); font-size: .8125em; letter-spacing: .02em; }
.pill { font: 600 11px/1.6 var(--body); border-radius: var(--r-full); padding: 1px 10px; white-space: nowrap; background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
.pill.good { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.crit { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.info { background: var(--soft); color: var(--ink); border-color: var(--line); }
.price { font: 700 1.125rem var(--display); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.edit { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; padding-top: 14px; margin-top: 4px; border-top: 1px solid var(--line); }
.edit .full { grid-column: 1 / -1; }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-lg); }
.empty h3 { color: var(--ink); font: 700 1.25rem var(--display); letter-spacing: -.01em; margin: 0 0 4px; }
.notice { padding: 12px 14px; border-radius: var(--r-sm); font-size: .875rem; background: var(--bad-soft); color: var(--bad); }

/* customers split */
.split { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); height: 100%; min-height: 0; }
.rail { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.rail-head { padding: 16px; border-bottom: 1px solid var(--line); }
.list { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
.crow { width: 100%; text-align: left; border: 0; background: none; border-radius: var(--r-sm); padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.crow:hover { background: var(--hover); }
.crow[aria-current="true"] { background: var(--soft); }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--on-fill); font-weight: 600; font-size: .8125rem; }
.crow .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crow .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crow .meta { font-size: 11px; color: var(--faint); text-align: right; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
.count { font: 500 11px var(--mono); border: 1px solid var(--line); border-radius: var(--r-full); padding: 0 7px; color: var(--muted); }
.detail { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.cust { background: var(--surface); border-bottom: 1px solid var(--line); padding: 18px 24px; display: flex; flex-direction: column; gap: 12px; }
.cust h2 { font: 700 1.6rem/1.1 var(--display); letter-spacing: -.02em; margin: 0; overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: .875rem; margin: 0; }
.facts div { display: flex; flex-direction: column; gap: 2px; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.back { display: none; }
.thread { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px 32px; }
.thread-in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.conv { margin: 20px 0 8px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.conv:first-child { margin-top: 0; }
.conv-date { font: 400 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-full); padding: 4px 12px; }
.conv details { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 14px; }
.conv summary { cursor: pointer; font-weight: 600; }
.conv details p { margin: 8px 0 0; color: var(--muted); font-size: .8125rem; }
.msg { display: flex; flex-direction: column; max-width: min(78%, 560px); }
.msg.in { align-self: flex-start; }
.msg.out { align-self: flex-end; align-items: flex-end; }
.bubble { padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.in .bubble { background: var(--bubble-in); border: 1px solid var(--line); border-top-left-radius: 4px; }
.msg.out .bubble { background: var(--bubble-out); border-top-right-radius: 4px; }
.time { font: 400 11px var(--mono); color: var(--faint); padding: 3px 4px 0; }
.tool { align-self: flex-end; font: 400 11px var(--mono); letter-spacing: .04em; color: var(--muted); padding: 2px 4px; }
.tool::before { content: "\2192  "; }

.grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.grid-form .full { grid-column: 1 / -1; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: var(--r-full); padding: 6px 12px; font: 500 .8125rem var(--body); letter-spacing: 0; text-transform: none; color: var(--ink); background: var(--surface); cursor: pointer; }
.checks input, .field .checks input { accent-color: var(--fill); width: 16px; height: 16px; padding: 0; margin: 0; border: 0; flex: none; }
.checks label:has(input:checked) { border-color: var(--fill); font-weight: 600; }
.linkbox { font: 400 .8125rem var(--mono); background: var(--soft); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; overflow-wrap: anywhere; user-select: all; }
.doclist { display: flex; flex-direction: column; gap: 8px; }
.docrow { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.kv { display: grid; grid-template-columns: minmax(130px, auto) minmax(0, 1fr); gap: 8px 16px; font-size: .9375rem; margin: 0; align-items: baseline; }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; display: flex; flex-direction: column-reverse; gap: 6px; }
.tile b { display: block; font: 800 2rem/1 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tile span { font: 400 11px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tablewrap { overflow-x: auto; }
table.ins { width: 100%; border-collapse: collapse; font-size: .875rem; }
table.ins th { text-align: left; font-weight: 400; padding: 8px; border-bottom: 1px solid var(--ink); }
table.ins td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.ins td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.barcell { min-width: 140px; }
.meter { height: 6px; border-radius: var(--r-full); background: var(--fill); }
.swatch { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; border: 1px solid var(--line); }
#toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--fill); color: var(--on-fill); padding: 10px 18px; border-radius: var(--r-full); font-size: .875rem; font-weight: 500; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: calc(100% - 32px); }
#toast.show { opacity: 1; }

/* phones and small tablets: top bar with scrolling tabs */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 0 0; gap: 10px; overflow: visible; display: grid; grid-template-columns: 1fr auto; }
  .side .brand { padding: 0 0 0 max(16px, env(safe-area-inset-left, 0px)); }
  .wordmark { font-size: 22px; }
  .bird { width: 26px; }
  .who { grid-column: 2; grid-row: 1; margin: 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 0; border: 0; flex-direction: row; align-items: center; }
  .who span { display: none; }
  .tabs { grid-column: 1 / -1; flex-direction: row; overflow-x: auto; padding: 0 max(12px, env(safe-area-inset-left, 0px)) 10px; scrollbar-width: none; }
  .tab { width: auto; padding: 8px 14px; }
  .badge { margin-left: 2px; }
  .page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 18px; }
}
@media (max-width: 760px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .split.showing .rail { display: none; }
  .split:not(.showing) .detail { display: none; }
  .back { display: inline-flex; }
  .msg { max-width: 88%; }
  .cust, .thread { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
  const SUPABASE_URL = "https://cskcmpayxaqyqlqhepup.supabase.co";
  const SUPABASE_KEY = "sb_publishable_kScNmyqH2eLLh24O2czVYA_pViZ08DL"; // public key; access is enforced by database rules
  const TZ = "America/Vancouver";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const toast = (t) => { const n = $("toast"); n.textContent = t; n.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => n.classList.remove("show"), 2600); };

  // ---------- formatting ----------
  const fDay = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, weekday: "short", month: "short", day: "numeric", year: "numeric" });
  const fShort = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, weekday: "short", month: "short", day: "numeric" });
  const fTime = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, hour: "numeric", minute: "2-digit" });
  const fWhen = (iso) => iso ? `${fShort.format(new Date(iso))}, ${fTime.format(new Date(iso))}` : "";
  const money = (c) => c == null ? "" : "$" + (c / 100).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function phone(wa) {
    const d = String(wa || "").replace(/\D/g, "");
    if (d.length === 11 && d[0] === "1") return `+1 ${d.slice(1, 4)}-${d.slice(4, 7)}-${d.slice(7)}`;
    if (d.length === 12 && d.startsWith("91")) return `+91 ${d.slice(2, 7)} ${d.slice(7)}`;
    return d ? "+" + d : "";
  }
  const cname = (c) => (c && (c.name || phone(c.whatsapp_user_id))) || "Unknown";
  const initials = (c) => c.name ? c.name.trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase() : String(c.whatsapp_user_id || "").slice(-2);
  function ago(iso) {
    if (!iso) return "";
    const s = (Date.now() - Date.parse(iso)) / 1000;
    if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago"; if (s < 604800) return Math.floor(s / 86400) + " d ago";
    return fShort.format(new Date(iso));
  }
  const TYPE = { homeowner: "Homeowner", property_manager: "Property manager", realtor: "Realtor" };
  const STATUS = {
    requested: ["New request", "warn"], quote_visit: ["Site visit", "info"], quoted: ["Quoted", "info"], booked: ["Booked", "info"],
    offered: ["Offered to contractors", "info"], assigned: ["Assigned", "info"], in_progress: ["In progress", "info"],
    completed: ["Completed", "good"], closed: ["Closed", "good"], cancelled: ["Cancelled", ""], disputed: ["Problem", "crit"],
  };
  const PAY = { unpaid: "Unpaid", deposit_paid: "Deposit paid", paid: "Paid", cash_recorded: "Cash", refunded: "Refunded", partially_refunded: "Part refunded" };
  const NEXT = {
    requested: ["quote_visit", "booked", "cancelled"], quote_visit: ["quoted", "cancelled"], quoted: ["booked", "cancelled"],
    booked: ["offered", "assigned", "cancelled"], offered: ["assigned", "booked", "cancelled"], assigned: ["in_progress", "offered", "cancelled"],
    in_progress: ["completed"], completed: ["closed", "disputed"], disputed: ["closed"], closed: [], cancelled: [],
  };
  const pill = (status) => { const [t, k] = STATUS[status] || [status, ""]; return el("span", "pill " + k, t); };
  const addr = (p) => p ? [p.unit, p.address_line, p.city].filter(Boolean).join(", ") : "";
  function linkify(parent, text) {
    const re = /(https?:\/\/[^\s<>"')]+)/g; let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) parent.append(text.slice(last, m.index));
      const a = el("a", null, m[1]); a.href = m[1]; a.target = "_blank"; a.rel = "noopener noreferrer"; parent.append(a);
      last = m.index + m[1].length;
    }
    if (last < text.length) parent.append(text.slice(last));
  }
  // Vancouver local datetime-input value <-> ISO
  function toLocalInput(iso) {
    if (!iso) return "";
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date(iso)).map((x) => [x.type, x.value]));
    return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
  }
  function fromLocalInput(v) {
    if (!v) return null;
    const guess = new Date(v + ":00Z");
    const shown = toLocalInput(guess.toISOString());
    const diff = Date.parse(v + ":00Z") - Date.parse(shown + ":00Z");
    return new Date(guess.getTime() + diff).toISOString();
  }

  function fail(host, err) {
    console.error(err);
    host.replaceChildren(el("div", "notice", "Couldn't load: " + (err && err.message ? err.message : "unknown error") + ". Try reloading the page."));
  }

  // ---------- routing ----------
  const view = $("view");
  let route = "requests";
  document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => { location.hash = b.dataset.go; }));
  window.addEventListener("hashchange", render);
  function render() {
    route = (location.hash.slice(1) || "requests").split("-")[0];
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.go === route)));
    view.replaceChildren();
    if (route === "jobs") renderJobs();
    else if (route === "customers") renderCustomers(location.hash.slice(1).split("-").slice(1).join("-") || null);
    else if (route === "account") renderAccount();
    else if (route === "contractors") renderContractors(location.hash.slice(1).split("-").slice(1).join("-") || null);
    else if (route === "settings") renderSettings();
    else if (route === "insights") renderInsights();
    else { route = "requests"; renderRequests(); }
    const TITLES = { requests: ["Requests", "People waiting on you"], jobs: ["Jobs", "Every booking, newest first"], contractors: ["Contractors", "Your network"], insights: ["Insights", "Where demand is coming from"], settings: ["Settings", "Rules for deposits, quotes and fees"], account: ["Account", "Your sign-in"] };
    const pg = view.querySelector(".page"), t = TITLES[route];
    if (pg && t && !/^#contractors-./.test(location.hash)) {
      const h = el("div", "pagehead"); h.append(el("div", "lbl", t[1]), el("h2", null, t[0])); pg.prepend(h);
    }
  }

  async function refreshBadges() {
    const [h, j] = await Promise.all([
      sb.from("handoffs").select("id", { count: "exact", head: true }).eq("status", "open"),
      sb.from("jobs").select("id", { count: "exact", head: true }).is("contractor_id", null).neq("fulfilment", "own_vendor").in("status", ["requested", "quote_visit", "quoted", "booked", "offered", "assigned", "in_progress"]),
    ]);
    $("reqBadge").textContent = h.count || "";
    $("jobBadge").textContent = j.count || "";
    const c = await sb.from("contractors").select("id", { count: "exact", head: true }).in("status", ["submitted", "applied"]);
    $("conBadge").textContent = c.count || "";
  }

  // ---------- requests ----------
  async function renderRequests() {
    const page = el("div", "page"); view.append(page);
    const tb = el("div", "toolbar");
    let showDone = false;
    const c1 = el("button", "chip", "Open"), c2 = el("button", "chip", "Done");
    [c1, c2].forEach((c) => { c.type = "button"; });
    tb.append(c1, c2); page.append(tb);
    const list = el("div"); list.style.cssText = "display:flex;flex-direction:column;gap:10px"; page.append(list);
    const load = async () => {
      c1.setAttribute("aria-pressed", String(!showDone)); c2.setAttribute("aria-pressed", String(showDone));
      list.replaceChildren(el("div", "sub", "Loading…"));
      const { data, error } = await sb.from("handoffs")
        .select("id, kind, reason, status, created_at, resolved_at, customer:customers(id, name, whatsapp_user_id), job:jobs(ref)")
        .eq("status", showDone ? "done" : "open").order("created_at", { ascending: false }).limit(100);
      if (error) return fail(list, error);
      list.replaceChildren();
      if (!data.length) {
        const e = el("div", "empty"); e.append(el("h3", null, showDone ? "Nothing here yet" : "All clear"),
          el("p", null, showDone ? "Requests you mark done show here." : "When a customer asks for a person or reports a problem, Preet puts it here."));
        return list.append(e);
      }
      for (const h of data) {
        const card = el("div", "card");
        const top = el("div", "row");
        const g = el("div", "grow");
        g.append(el("div", "title", cname(h.customer)), el("div", "sub", [phone(h.customer && h.customer.whatsapp_user_id), ago(h.created_at), h.job && h.job.ref].filter(Boolean).join(" · ")));
        top.append(g, el("span", "pill " + (h.kind === "problem" ? "crit" : "warn"), h.kind === "problem" ? "Problem" : "Wants a person"));
        card.append(top);
        if (h.reason) card.append(el("div", null, h.reason));
        const btns = el("div", "toolbar");
        const chat = el("button", "btn", "Open chat"); chat.type = "button";
        chat.addEventListener("click", () => { location.hash = "customers-" + h.customer.id; });
        btns.append(chat);
        if (h.status === "open") {
          const done = el("button", "btn primary", "Mark done"); done.type = "button";
          done.addEventListener("click", async () => {
            done.disabled = true;
            const { error: e } = await sb.from("handoffs").update({ status: "done", resolved_at: new Date().toISOString() }).eq("id", h.id);
            if (e) { done.disabled = false; return toast("Couldn't save: " + e.message); }
            card.remove(); toast("Marked done"); refreshBadges();
          });
          btns.append(done);
        }
        card.append(btns); list.append(card);
      }
    };
    c1.addEventListener("click", () => { showDone = false; load(); });
    c2.addEventListener("click", () => { showDone = true; load(); });
    load();
  }

  // ---------- jobs ----------
  async function renderJobs() {
    const page = el("div", "page"); view.append(page);
    const tb = el("div", "toolbar");
    const search = el("input", "search grow"); search.type = "search"; search.placeholder = "Search job number, name, address";
    const groups = { unassigned: "Needs a contractor", active: "Active", new: "New requests", done: "Completed", cancelled: "Cancelled", all: "All" };
    let group = "active";
    const chips = Object.entries(groups).map(([k, t]) => { const c = el("button", "chip", t); c.type = "button"; c.dataset.k = k; return c; });
    tb.append(search, ...chips); page.append(tb);
    const list = el("div"); list.style.cssText = "display:flex;flex-direction:column;gap:10px"; page.append(list);
    let jobs = [];

    const [{ data, error }, cons] = await Promise.all([sb.from("jobs")
      .select("id, ref, status, service_code, contractor_id, contractor:contractors(id, business_name), quotes(ref, status, total_cents, deposit_cents, chosen_date, valid_until, viewed_at, customer_note, created_at), calendar_events(kind, starts_at, status), date_requests(status, dates, chosen_date, created_at), invoices(number, display_number, status, total_cents, paid_cents, deposit_cents, token), job_photos(id, kind, storage_path, removed_at, created_at), started_at, completed_at, pay_status, pay_method, price_cents, variant, fulfilment, vendor_name, vendor_phone, window_start, window_end, scheduled_start, scheduled_end, notes, details, cancel_reason, created_at, service:services(name, mode), property:properties(address_line, unit, city, postal_code), customer:customers(id, name, whatsapp_user_id, type, company)")
      .order("created_at", { ascending: false }).limit(300),
      sb.from("contractors").select("id, business_name, in_house, contractor_services(service_code), contractor_areas(city)").eq("status", "active").order("business_name")]);
    if (error) return fail(list, error);
    jobs = data; activeCons = cons.data || [];
    const nUn = jobs.filter(needsContractor).length;
    if (nUn) { group = "unassigned"; chips[0].textContent = `Needs a contractor (${nUn})`; }

    const draw = () => {
      chips.forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.k === group)));
      const q = search.value.trim().toLowerCase();
      const rows = jobs.filter((j) => {
        if (group === "unassigned" && !needsContractor(j)) return false;
        if (group === "active" && ["completed", "closed", "cancelled"].includes(j.status)) return false;
        if (group === "new" && j.status !== "requested") return false;
        if (group === "done" && !["completed", "closed"].includes(j.status)) return false;
        if (group === "cancelled" && j.status !== "cancelled") return false;
        if (!q) return true;
        return [j.ref, cname(j.customer), j.customer && j.customer.whatsapp_user_id, addr(j.property), j.service && j.service.name].join(" ").toLowerCase().includes(q);
      });
      list.replaceChildren();
      if (!rows.length) {
        const e = el("div", "empty"); e.append(el("h3", null, group === "unassigned" ? "Every job has a contractor" : "No jobs here"), el("p", null, group === "unassigned" ? "Bookings that no contractor covers show up here for you to assign." : "Jobs Preet books on WhatsApp appear here straight away."));
        return list.append(e);
      }
      rows.forEach((j) => list.append(jobCard(j)));
    };
    search.addEventListener("input", draw);
    chips.forEach((c) => c.addEventListener("click", () => { group = c.dataset.k; draw(); }));
    draw();
  }

  let activeCons = [];
  const OPEN = ["requested", "quote_visit", "quoted", "booked", "offered", "assigned", "in_progress"];
  const needsContractor = (j) => !j.contractor_id && j.fulfilment !== "own_vendor" && OPEN.includes(j.status);
  // contractor picker grouped by how well each fits this job
  function contractorSelect(j) {
    const sel = el("select");
    const city = ((j.property && j.property.city) || "").toLowerCase();
    const offers = (c) => (c.contractor_services || []).some((s) => s.service_code === j.service_code);
    const covers = (c) => (c.contractor_areas || []).some((a) => (a.city || "").toLowerCase() === city);
    const best = [], house = [], other = [], outside = [];
    activeCons.forEach((c) => {
      if (c.in_house) house.push(c);
      else if (offers(c) && covers(c)) best.push(c);
      else if (offers(c)) other.push(c);
      else outside.push(c);
    });
    sel.append(new Option(j.contractor_id ? "No contractor" : "Choose a contractor\u2026", ""));
    const grp = (label, arr, note) => { if (!arr.length) return; const g = document.createElement("optgroup"); g.label = label; arr.forEach((c) => g.append(new Option(c.business_name + (note ? " \u00b7 " + note(c) : ""), c.id))); sel.append(g); };
    grp("Offers this service in " + ((j.property && j.property.city) || "this city"), best);
    grp("In-house", house, (c) => offers(c) ? "offers this service" : "other services");
    grp("Offers this service, other cities", other, (c) => (c.contractor_areas || []).map((a) => a.city).slice(0, 3).join(", ") || "no cities set");
    grp("Doesn't list this service", outside);
    if (j.contractor && !activeCons.some((c) => c.id === j.contractor.id)) sel.append(new Option(j.contractor.business_name + " (not active)", j.contractor.id));
    sel.value = j.contractor_id || "";
    sel.hint = best.length ? "" : "No contractor offers this service in this city yet. In-house and other contractors are listed below.";
    return sel;
  }
  async function assign(j, cid) {
    const { data, error } = await sb.schema("admin").rpc("admin_assign_contractor", { p_job: j.id, p_contractor: cid || null });
    if (error) throw error;
    const c = activeCons.find((x) => x.id === cid);
    toast(cid ? `${j.ref} assigned to ${c ? c.business_name : "contractor"}` : `${j.ref} unassigned`);
    return data;
  }
  function jobCard(j) {
    const card = el("div", "card");
    const top = el("div", "row");

  function linkCard(title, token, phoneNum, name) {
    const url = PROS_URL + "#join-" + token;

    box.append(el("div", "title", title), el("div", "sub", "Send this link to the contractor. It works once and expires; you can make a new one any time."));

      list.forEach((r) => {
        const k = keyOf(r); if (!k) return;
        const g = m.get(k) || { name: k, count: 0, people: new Set(), wants: 0, also: new Map(), last: r.created_at };
        g.count++; if (r.customer_id) g.people.add(r.customer_id); if (r.wants_update) g.wants++;
        const a = alsoOf(r); if (a) g.also.set(a, (g.also.get(a) || 0) + 1);
        if (r.created_at > g.last) g.last = r.created_at;
        m.set(k, g);
      });
      return [...m.values()].map((g) => ({ ...g, people: g.people.size, also: [...g.also.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4).map(([n, c]) => `${n} (${c})`).join(", ") }))
        .sort((a, b) => b.count - a.count);
    };

    host.append(table("Services people asked for that Sparrow doesn't offer",
      group(d.filter((r) => r.kind === "service"), (r) => title(tidy(r.service_text || r.service_code)), (r) => r.city && title(tidy(r.city))),
      "None yet. When a customer asks Preet for something Sparrow doesn't do, it shows here."));
    host.append(table("Cities outside the service area",
      group(d.filter((r) => r.kind === "city" && r.city), (r) => title(tidy(r.city)), (r) => r.service_code ? svcName[r.service_code] || r.service_code : r.service_text && title(tidy(r.service_text))),
      "None yet. When someone outside your cities asks, their city shows here."));
    host.append(table("Bookings with no contractor available",
      group(d.filter((r) => r.kind === "no_contractor"), (r) => `${svcName[r.service_code] || r.service_code || "Service"} in ${title(tidy(r.city || "unknown"))}`, () => null),
      "None yet. Once jobs are matched to contractors automatically, any booking with nobody to take it shows here: that's where to recruit."));

    // bookings by city × service
    const byCity = new Map();
    jobs.forEach((j) => {
      const city = (j.property && j.property.city) || "Unknown"; const s = (j.service && j.service.name) || "Other";
      const g = byCity.get(city) || { name: city, count: 0, people: new Set(), wants: 0, also: new Map(), last: j.created_at };
      g.count++; if (j.customer_id) g.people.add(j.customer_id); g.also.set(s, (g.also.get(s) || 0) + 1); if (j.created_at > g.last) g.last = j.created_at;
      byCity.set(city, g);
    });
    const cityRows = [...byCity.values()].map((g) => ({ ...g, people: g.people.size, wants: "–", also: [...g.also.entries()].sort((a, b) => b[1] - a[1]).map(([n, c]) => `${n} (${c})`).join(", ") })).sort((a, b) => b.count - a.count);
    const bc = table("Bookings by city", cityRows, "No bookings in this period.");
    bc.querySelectorAll("th").forEach((th, i) => { if (i === 1) th.textContent = "Bookings"; if (i === 4) th.textContent = ""; if (i === 5) th.textContent = "Services"; if (i === 6) th.textContent = "Last booking"; });
    host.append(bc);
  }

  // ---------- settings ----------
  async function renderSettings() {
    const page = el("div", "page"); page.style.maxWidth = "720px"; view.append(page);
    const { data, error } = await sb.schema("admin").from("settings").select("key, value");
    if (error) return fail(page, error);
    const s = Object.fromEntries(data.map((r) => [r.key, r.value]));
    const f = el("form", "card");
    f.append(el("div", "title", "Platform rules"), el("div", "sub", "Changes apply to new quotes, bookings and contractors from now on. Every change is logged."));
    const g = el("div", "grid-form");
    const num = (label, key, toUi, fromUi, step) => {
      const l = el("label", "field", label); const i = el("input"); i.type = "number"; i.step = step || "any"; i.value = s[key] == null ? "" : toUi(Number(s[key])); l.append(i);
      l.read = () => [key, fromUi(Number(i.value))]; l.input = i; g.append(l); return l;
    };
    const pct = (v) => +(v * 100).toFixed(2), unpct = (v) => +(v / 100).toFixed(4), dollars = (v) => v / 100, cents = (v) => Math.round(v * 100), same = (v) => v;
    const fields = [
      num("Sparrow commission (%)", "commission_rate", pct, unpct),
      num("Deposit needed when quote is over ($, before GST)", "deposit_threshold_cents", dollars, cents, "1"),
      num("Deposit for new customers (%)", "deposit_rate_new", pct, unpct),
      num("Deposit for returning customers (%)", "deposit_rate_returning", pct, unpct),
      num("Quotes valid for (days)", "quote_valid_days", same, Math.round, "1"),
      num("Late-cancel cutoff (hours before)", "cancel_cutoff_hours", same, Math.round, "1"),
      num("Late-cancel fee ($)", "cancel_fee_cents", dollars, cents, "1"),
      num("Contractor owing limit ($)", "owing_limit_cents", dollars, cents, "1"),
      num("Contractor owing limit (days)", "owing_limit_days", same, Math.round, "1"),
      num("Minimum liability insurance ($)", "min_insurance_cents", dollars, cents, "1"),
      num("GST (%)", "gst_rate", pct, unpct),
      num("Invite links valid for (days)", "invite_valid_days", same, Math.round, "1"),
    ];
    const cities = el("label", "field full", "Service cities (one per line)"); const ta = el("textarea"); ta.rows = 6; ta.value = (s.service_cities || []).join("\n"); cities.append(ta); g.append(cities);
    const tpl = el("label", "field full toggle"); const cb = el("input"); cb.type = "checkbox"; cb.checked = s.whatsapp_templates_enabled === true; tpl.append(cb, "Send WhatsApp template messages automatically"); g.append(tpl);
    const err = el("div", "err"); const save = el("button", "btn primary", "Save rules"); save.type = "submit";
    f.append(g, save, err); page.append(f);
    f.addEventListener("submit", async (e) => {
      e.preventDefault(); err.textContent = "";
      const p = {};
      for (const fl of fields) { if (fl.input.value === "") continue; const [k, v] = fl.read(); if (!isFinite(v) || v < 0) return (err.textContent = "Check the numbers: they can't be negative."); p[k] = v; }
      if (p.deposit_rate_new > 1 || p.deposit_rate_returning > 1 || p.commission_rate > 1) return (err.textContent = "Percentages must be 100 or less.");
      p.service_cities = ta.value.split("\n").map((x) => x.trim()).filter(Boolean);
      p.whatsapp_templates_enabled = cb.checked;
      save.disabled = true;
      const { error: e2 } = await sb.schema("admin").rpc("admin_save_settings", { p });
      save.disabled = false;
      if (e2) return (err.textContent = errMsg(e2));
      toast("Rules saved");
    });
  }

  // ---------- account ----------
  function renderAccount() {
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", "false"));
    const page = el("div", "page"); page.style.maxWidth = "460px"; view.append(page);
    const card = el("form", "card");
    card.append(el("div", "title", "Change password"));
    const f1 = el("label", "field", "New password (at least 10 characters)"); const p1 = el("input"); p1.type = "password"; p1.autocomplete = "new-password"; f1.append(p1);
    const f2 = el("label", "field", "Type it again"); const p2 = el("input"); p2.type = "password"; p2.autocomplete = "new-password"; f2.append(p2);
    const err = el("div", "err"); const save = el("button", "btn primary", "Save new password"); save.type = "submit";
    card.append(f1, f2, save, err);
    card.addEventListener("submit", async (e) => {
      e.preventDefault(); err.textContent = "";
      if (p1.value.length < 10) return (err.textContent = "Use at least 10 characters.");
      if (p1.value !== p2.value) return (err.textContent = "The two passwords don't match.");
      save.disabled = true;
      const { error } = await sb.auth.updateUser({ password: p1.value });
      save.disabled = false;
      if (error) return (err.textContent = error.message);
      p1.value = p2.value = ""; toast("Password changed");
    });
    const out = el("div", "card"); const so = el("button", "btn danger", "Sign out"); so.type = "button";
    so.addEventListener("click", async () => { await sb.auth.signOut(); location.hash = ""; location.reload(); });
    out.append(el("div", "title", "Session"), el("div", "sub", "Signed in as " + ($("whoEmail").textContent || "")), so);
    page.append(card, out);
  }

  // ---------- auth ----------
  async function start(session) {
    const { data: me, error } = await sb.schema("admin").from("admins").select("user_id").eq("user_id", session.user.id).maybeSingle();
    if (error || !me) {
      await sb.auth.signOut();
      $("app").hidden = true; $("login").hidden = false;
      $("loginErr").textContent = "This account isn't a Sparrow admin.";
      return;
    }
    $("whoEmail").textContent = session.user.email;
    $("login").hidden = true; $("app").hidden = false;
    render(); refreshBadges();
    setInterval(refreshBadges, 60000);
  }
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault(); $("loginErr").textContent = ""; $("loginBtn").disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    $("loginBtn").disabled = false;
    if (error) { $("loginErr").textContent = error.message === "Invalid login credentials" ? "Wrong email or password." : error.message; return; }
    start(data.session);
  });
  sb.auth.getSession().then(({ data }) => { if (data.session) start(data.session); else $("login").hidden = false; });
})();
</script>
</body>
</html>
