/* ---- Sparrow Pros on the Crew design: tokens and components the Crew app doesn't have ---- */
:root { --surface: #fff; --raised: var(--soft); --accent: var(--ink); --accent-ink: #fff; --accent-soft: var(--tint); --accent-line: #f9cdb9;
  --good: var(--ok); --good-soft: var(--ok-soft); --crit: var(--danger); --crit-soft: var(--danger-soft); --info: #2453b3; --info-soft: #eaf0fc;
  --display: "Bricolage Grotesque", sans-serif; --body: Geist, system-ui, sans-serif; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h3 { margin: 0; font-size: 17px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: 14px; }
.main { display: flex; flex-direction: column; gap: 14px; }
.main > .page-head { margin-bottom: 4px; }
.main h2 { margin: 0; }
.card { display: flex; flex-direction: column; gap: 12px; }
.card h2, .job h2 { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -.03em; line-height: 1.1; }
.wordmark svg.bird { width: 26px; height: 22px; flex: none; color: var(--ink); }
.side .wordmark { margin: 0 10px 24px; }
.side .biz-status { padding: 0 12px 6px; }
.field { display: flex; flex-direction: column; gap: 6px; margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { background: var(--soft); border: 1px solid transparent; border-radius: 14px; width: 100%; min-height: 48px; padding: 12px 14px; font-size: 16px; font-weight: 400; color: var(--ink); }
.field textarea { min-height: 96px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--ink); background: var(--bg); outline: none; }
.field input[readonly] { opacity: .7; }
.card .field input, .card .field select, .card .field textarea, .job .field input, .job .field textarea { background: var(--bg); }
.modal .field input, .modal .field select, .modal .field textarea, .modal .money { background: var(--soft); }
.grid2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.err { color: var(--danger); font-size: 14px; min-height: 1.2em; }
.ok { color: var(--ok); font-size: 14px; }
.btn.back { background: none; color: var(--ink); box-shadow: none; padding: 0; min-height: 36px; font-weight: 500; align-self: flex-start; }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.main .btn.small:not(.primary):not(.ghost):not(.back), .detail .btn.small:not(.primary):not(.ghost) { background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 1px #e4e4e7; }
.main .btn.small:not(.primary):not(.ghost):not(.back):hover { background: var(--soft); }
.pill.p-good { color: var(--ok); background: var(--ok-soft); } .pill.p-warn { color: var(--warn); background: var(--warn-soft); }
.pill.p-crit { color: var(--danger); background: var(--danger-soft); } .pill.p-info { color: var(--info); background: var(--info-soft); }
.pill.p-none { background: var(--soft); color: #3f3f46; }
.card .pill.p-none, .job .pill.p-none { background: var(--bg); }
.banner { border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; background: var(--soft); }
.banner.info { background: var(--info-soft); } .banner.good { background: var(--ok-soft); } .banner.warn { background: var(--warn-soft); } .banner.crit { background: var(--danger-soft); }
.banner h3 { font-size: 16px; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 12px; font-size: 15px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.job { background: var(--soft); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.job-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.job .ref, .ref { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.job h3 { font-size: 18px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { background: var(--soft); border: 0; border-radius: 999px; height: 36px; padding: 0 14px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--ink); }
.seg button.on { background: var(--ink); color: #fff; }
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--soft); border: 0; border-radius: 18px; padding: 14px 16px; text-align: left; cursor: pointer; width: 100%; }
.step:hover { background: #ececee; }
.tick { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--muted); font-weight: 700; font-size: 13px; }
.tick.done { background: var(--ink); color: #fff; }
.step .t { font-weight: 600; } .step .d { font-size: 13px; color: var(--muted); }
.progress { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width .3s; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.check { display: flex; gap: 10px; align-items: center; background: var(--bg); border-radius: 14px; padding: 12px 14px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; }
.check input { width: 18px; height: 18px; accent-color: var(--ink); flex: none; }
.doc { background: var(--bg); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.doc-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.terms { max-height: 340px; overflow-y: auto; white-space: pre-wrap; background: var(--bg); border-radius: 14px; padding: 14px; font-size: 15px; }
.logo-prev { width: 96px; height: 96px; border: 1px dashed #d4d4d8; border-radius: 14px; display: grid; place-items: center; overflow: hidden; background: var(--bg); color: var(--faint); font-size: 12px; text-align: center; }
.logo-prev img { max-width: 100%; max-height: 100%; }
.invoice-prev { border-radius: 14px; padding: 14px; display: flex; gap: 12px; align-items: center; background: var(--bg); border-top: 6px solid var(--brand); }
.price-row { display: grid; grid-template-columns: minmax(0, 1fr) 130px; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid #e4e4e7; }
.price-row:first-of-type { border-top: 0; }
.price-row .lbl { min-width: 0; } .price-row .lbl small { display: block; color: var(--muted); font-size: 13px; }
.money { display: flex; align-items: center; background: var(--soft); border-radius: 12px; padding: 0 10px; border: 1px solid transparent; }
.card .money, .job .money { background: var(--bg); }
.money span { color: var(--muted); } .money input { border: 0; background: transparent; padding: 10px 6px; width: 100%; font-size: 16px; color: var(--ink); text-align: right; min-width: 0; }
.money input:focus { outline: none; } .money:focus-within { border-color: var(--ink); }
.tpl { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid #e4e4e7; flex-wrap: wrap; }
.tpl:first-of-type { border-top: 0; } .tpl .lbl { min-width: 0; flex: 1 1 200px; }
.qline { display: grid; grid-template-columns: minmax(0, 1fr) 84px 110px 120px 92px 36px; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid #e4e4e7; }
.qline:first-child { border-top: 0; }
.qline input, .qline select, .datepick input, .iline input { border: 1px solid transparent; background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 15px; color: var(--ink); width: 100%; min-width: 0; min-height: 44px; }
.qline input:focus, .datepick input:focus, .iline input:focus { border-color: var(--ink); outline: none; }

  // ---------- join / reset ----------
  async function renderJoin(token) {
    let card = authPage([el("p", "note", "Checking your link…")]);
    let info;
    try {
      const r = await fetch(AUTH_FN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "check", token }) });
      info = await r.json();
    } catch { info = { ok: false, message: "Couldn't reach Sparrow. Check your connection and try again." }; }
    if (!info.ok) {
      card = authPage([el("h1", null, "This link doesn't work"), el("p", "note", info.message || "Ask for a new link.")]);
      const b = btn("Go to sign in", "", () => { history.replaceState(null, "", location.pathname); route(); }); b.style.marginTop = "18px"; card.append(b);
      return;
    }
    const reset = info.kind === "reset", crew = info.kind === "crew";
    const first = info.contact_name ? info.contact_name.split(" ")[0] : "";
    const intro = reset ? `For ${info.email}.` : crew ? `${info.business_name} added you to their crew. Set a password to see your jobs, or use your Google account. You'll sign in with ${info.email}.`
      : `Sparrow invited ${info.business_name} to join. Set a password to create your account, or use your Google account. You'll sign in with ${info.email}.`;
    const em = field("Email", info.email, { readonly: true, autocomplete: "username" });

    const p2 = field("Type it again", "", { type: "password", autocomplete: "new-password", id: "p2" });

      const gb = googleButton("Continue with Google instead", token); gb.style.width = "100%";
      card.insertBefore(orLine(), err.nextSibling); card.append(gb);
    }
    card.addEventListener("submit", async (e) => {
      e.preventDefault(); err.textContent = "";
      if (p1.input.value.length < 10) return (err.textContent = "Use at least 10 characters.");
      if (p1.input.value !== p2.input.value) return (err.textContent = "The two passwords don't match.");
      go.disabled = true;
      try {
        const r = await fetch(AUTH_FN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "claim", token, password: p1.input.value }) });
        const res = await r.json();

    });
  }

    const { data } = await sb.auth.getSession();
    let h = location.hash.slice(1);
    if (/(^|&)(access_token|refresh_token|error|error_description)=/.test(h)) {
      const q = new URLSearchParams(h); history.replaceState(null, "", location.pathname); h = "";
      if (!data.session) return renderLogin(q.get("error_description") ? "That sign-in didn't work: " + q.get("error_description").replace(/\+/g, " ") + ". Try again." : "");
    }
    if (h.startsWith("join-")) return renderJoin(h.slice(5));
    if (h === "signup" && !data.session) return renderSignup();
    if (!data.session) return renderLogin();
    if (recoveryMode) return renderNewPassword();
    let pending = null; try { pending = localStorage.getItem("pending_invite"); localStorage.removeItem("pending_invite"); } catch { /* private mode */ }
    if (pending) {
      try {
        const r = await fetch(AUTH_FN, { method: "POST", headers: { "Content-Type": "application/json", authorization: "Bearer " + data.session.access_token }, body: JSON.stringify({ action: "claim_oauth", token: pending }) });
        const res = await r.json();
        if (!res.ok) { await sb.auth.signOut(); return renderLogin(res.message || "Couldn't link your Google account."); }
        toast("You're in");
      } catch { await sb.auth.signOut(); return renderLogin("Couldn't reach Sparrow. Open your invite link and try again."); }
    }
    try { who = await rpc("app_whoami"); } catch (e) { return renderFatal(friendly(e)); }
    if (who.kind === "crew") return routeCrew(h);
    if (who.kind === "crew_off") { await sb.auth.signOut(); return renderLogin("Your crew access is turned off. Ask your boss to turn it back on."); }
    try { await loadMe(); } catch (e) { return renderFatal(friendly(e)); }
    if (!me.ok) { if (await adminElsewhere()) return; return renderSetupBusiness(data.session.user.email); }
    if (h.startsWith("s-")) return renderSection(h.slice(2));
    if (h === "account") return isSub() ? renderSubAccount() : renderAccount();
    if (h === "jobs") return renderJobs();
    if (h.startsWith("quote-")) return renderQuote(h.slice(6));
    if (h.startsWith("job-")) return renderJobDay(h.slice(4));
    if (h === "prices" && !isSub()) return renderPrices();
    if (h === "customers") return renderCustomers();
    if (h === "calendar") return renderCalendar();
    if ((CREW_TOOL_TITLES[h] || h.startsWith("messages")) && !canGetJobs()) return renderNotActive(h);

    if (h === "schedule") return renderSchedule();

  }

  async function shrinkPhoto(file) {
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas"); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.82));
      if (blob) return blob;
    } catch (e) { /* fall back to the original file */ }
    if (file.size > 12 * 1024 * 1024) throw new Error("That photo is too large. Try a smaller one.");
    return file;
  }

    const inWeek = t.entries.filter((e) => e.day >= tsWeek && e.day <= addDays(tsWeek, 6));
    const stats = el("div", "stats");
    const byMember = {}; inWeek.forEach((e) => { byMember[e.member] = (byMember[e.member] || 0) + Number(e.hours); });
    const total = Object.values(byMember).reduce((a, b) => a + b, 0);
    const st = (label, v) => { const s = el("div", "stat"); s.append(el("span", "label", label), el("strong", null, v)); stats.append(s); };
    st("Total this week", hours(total)); Object.entries(byMember).forEach(([n, h]) => st(n, hours(h)));
    const parts = [...head, tb, stats];
    const open = t.entries.filter((e) => !e.clock_out_at);
    if (open.length) { const b = el("div", "banner warn"); b.append(el("p", "small", "On the clock now: " + open.map((e) => `${e.member} since ${hm(e.clock_in_at)}${e.day !== todayISO() ? " on " + dayShort(e.day) + " (check this)" : ""}`).join(", "))); parts.push(b); }
    const tw = el("div", "table-wrap"); const tbl = el("table", "table");
    tbl.innerHTML = "<thead><tr><th>Day</th><th>Who</th><th>Job</th><th>In</th><th>Out</th><th class=\"num\">Hours</th><th></th></tr></thead>";
    const body = el("tbody");
    if (!inWeek.length) { const tr = el("tr"); const td = el("td", "note", "No time this week."); td.colSpan = 7; tr.append(td); body.append(tr); }
    inWeek.forEach((e) => {
      const tr = el("tr");
      const jt = el("td"); jt.append(e.job || "No job"); if (e.edited) jt.append(el("span", "note", "Edited: " + (e.edit_reason || "")));
      const ed = btn("Edit", "ghost small", () => entryModal(t, e));
      const c = el("td"); c.append(ed);
      tr.append(el("td", null, dayShort(e.day)), el("td", null, e.member), jt, el("td", null, hm(e.clock_in_at)), el("td", null, e.clock_out_at ? hm(e.clock_out_at) : "On the clock"), el("td", "num", hours(Number(e.hours))), c);
      body.append(tr);
    });
    tbl.append(body); tw.append(tbl); parts.push(tw);
    shell(parts);
  }
  async function entryModal(t, e) {
    let jobs = []; try { jobs = (await rpc("owner_board", { p_from: todayISO(), p_to: todayISO() })).jobs; } catch { /* job list is optional */ }
    modal(e ? "Fix time" : "Add time", (m, close) => {
      const who = e ? null : selectField("Who", t.members.map((x) => [x.id, x.name]));
      const ci = field("Clock in", vanInput(e ? e.clock_in_at : new Date(Date.now() - 8 * 36e5)), { type: "datetime-local" });
      const co = field("Clock out", vanInput(e ? e.clock_out_at : new Date()), { type: "datetime-local" });
      const opts = [["", "No job"], ...jobs.map((j) => [j.id, j.label])]; if (e && e.job_id && !jobs.some((j) => j.id === e.job_id)) opts.push([e.job_id, e.job]);
      const job = selectField("Job", opts, e ? e.job_id || "" : "");
      const reason = field("Reason for the change", "", { placeholder: e ? "Forgot to clock out" : "Forgot to clock in" });
      const err = el("div", "err");
      const save = btn("Save", "", async () => {
        save.disabled = true; err.textContent = "";
        try { await rpc("time_entry_save", { p: { id: e ? e.id : "", member_id: who ? who.input.value : "", clock_in_at: fromInput(ci.input.value), clock_out_at: fromInput(co.input.value), job_id: job.input.value, reason: reason.input.value } }); close(); toast("Saved"); renderTimesheets(); }
        catch (x) { err.textContent = friendly(x); save.disabled = false; }
      });
      const r = el("div", "row"); r.append(save);
      if (e) { const rm = btn("Remove entry", "ghost", async () => { if (!reason.input.value.trim()) return (err.textContent = "Add a reason first."); if (rm.dataset.sure !== "1") { rm.dataset.sure = "1"; rm.textContent = "Tap again to remove"; return; }
        try { await rpc("time_entry_remove", { p_entry: e.id, p_reason: reason.input.value }); close(); toast("Removed"); renderTimesheets(); } catch (x) { err.textContent = friendly(x); } }); r.append(rm); }
      const f = el("div", "stack"); f.style.marginTop = "12px"; if (who) f.append(who); f.append(ci, co, job, reason, r, err); m.append(f);
    });
  }

  // ---------- updates ----------
  async function renderUpdates() {
    const head = [el("h2", null, "Crew updates"), el("p", "note", "Problems, daily reports, time off and low stock from your crew.")];
    shell([...head, el("p", "mono", "Loading…")]);
    let u; try { u = await rpc("owner_updates"); } catch (e) { return renderFatal(friendly(e)); }
    drawUpdates(head, u);
  }
  function drawUpdates(head, u) {
    const parts = [...head];
    const sec = (title, items, empty) => { const s = el("div", "section"); s.append(el("span", "label", title)); if (!items.length) s.append(el("p", "note", empty)); items.forEach((x) => s.append(x)); parts.push(s); };
    const act = (text, cls, fn) => { const b = btn(text, cls + " small", async () => { b.disabled = true; try { drawUpdates(head, await fn()); } catch (e) { toast(friendly(e)); b.disabled = false; } }); return b; };
    const clock = [...u.on_clock.map((c) => li({ initial: c.member[0], title: c.member, sub: `${c.job || "No job"} · since ${hm(c.since)}`, right: el("span", "pill ok", "On the clock") })),
      ...u.late.map((c) => li({ initial: c.member[0], title: c.member, sub: `Not clocked in · ${c.job || "shift"} started ${hm(c.starts_at)}`, right: el("span", "pill danger", "Late"), tint: true }))];
    const lc = el("div", "list-card"); clock.forEach((x) => lc.append(x)); if (!clock.length) lc.append(el("div", "li note", "Nobody is clocked in."));
    const s0 = el("div", "section"); const hs = el("div", "h-sec"); hs.append(el("h3", null, "On the clock")); const a = el("a", "btn ghost small", "Timesheets"); a.href = "#timesheets"; hs.append(a); s0.append(hs, lc); parts.push(s0);
    sec("Problems", u.alerts.map((x) => {
      const f = el("div", "feed-item"); const meta = el("div", "meta");
      meta.append(el("span", "pill " + (x.urgency === "high" ? "danger" : x.status === "resolved" ? "ok" : "warn"), (x.urgency === "high" ? "Urgent · " : "") + (ALERT_TYPES[x.type] || x.type)), el("span", "note", `${x.member || "Crew"} · ${x.job || "No job"} · ${whenTime(x.created_at)}`));
      f.append(meta, el("p", null, x.body));
      const ac = el("div", "actions");
      if (x.status === "open") ac.append(act("Seen", "ghost", () => rpc("alert_set_status", { p_alert: x.id, p_status: "seen" })));
      if (x.status !== "resolved") ac.append(act("Resolved", "", () => rpc("alert_set_status", { p_alert: x.id, p_status: "resolved" })));
      else ac.append(el("span", "note", "Resolved"));
      f.append(ac); return f;
    }), "No problems reported.");
    sec("Time off", u.time_off.map((r) => {
      const f = el("div", "feed-item"); const meta = el("div", "meta");
      meta.append(el("span", "pill " + (r.status === "pending" ? "warn" : r.status === "approved" ? "ok" : ""), r.status === "pending" ? "Needs your answer" : r.auto ? "Approved automatically" : r.status === "approved" ? "Approved" : "Declined"),
        el("span", "note", r.member));
      f.append(meta, el("p", null, r.start_date === r.end_date ? dayShort(r.start_date) : `${dayShort(r.start_date)} to ${dayShort(r.end_date)}` + (r.reason ? ` · ${r.reason}` : "")));
      if (r.clashes) f.append(el("p", "note", `${r.clashes} shift${r.clashes === 1 ? " is" : "s are"} booked for them in that time.`));
      if (r.status === "pending") { const ac = el("div", "actions"); ac.append(act("Approve", "", () => rpc("time_off_decide", { p_request: r.id, p_approve: true })), act("Decline", "ghost", () => rpc("time_off_decide", { p_request: r.id, p_approve: false }))); f.append(ac); }
      return f;
    }), "No time off coming up.");
    const nd = el("p", "note"); nd.append(`Requests made at least ${u.notice_days} days ahead, with no shifts booked, are approved automatically. `);
    const ch = el("a", null, "Change"); ch.href = "#"; ch.addEventListener("click", (e) => { e.preventDefault();
      modal("Time off rule", (m, close) => { const d = field("Approve automatically when asked this many days ahead", u.notice_days, { type: "number", inputmode: "numeric" }); const err = el("div", "err");
        const s = btn("Save", "", async () => { try { await rpc("inventory_save", { p: { action: "notice_days", days: Number(d.input.value) } }); close(); renderUpdates(); } catch (x) { err.textContent = friendly(x); } });
        const f = el("div", "stack"); f.style.marginTop = "12px"; const r = el("div", "row"); r.append(s); f.append(d, r, err); m.append(f); }); });
    nd.append(ch); parts[parts.length - 1].append(nd);
    sec("Daily reports", u.reports.map((r) => {
      const f = el("div", "feed-item"); const meta = el("div", "meta");
      meta.append(el("b", null, r.job || "Job"), el("span", "note", dayShort(r.report_date)), r.seen ? el("span", "pill", "Seen") : el("span", "pill brand", "New"));
      f.append(meta); (r.entries || []).forEach((e) => { const en = el("div", "entry"); en.append(el("span", "note", `${e.member || "Crew"} · ${hm(e.created_at)}`), el("p", null, e.body)); f.append(en); });
      if (!r.seen) { const ac = el("div", "actions"); ac.append(act("Mark seen", "ghost", () => rpc("report_mark_seen", { p_report: r.id }))); f.append(ac); }
      return f;
    }), "No daily reports in the last two weeks.");
    sec("Low stock", u.low_stock.map((i) => li({ initial: "!", title: `${i.name} · ${i.location}`, sub: `${i.status === "out" ? "Out" : "Running low"}${i.by ? " · flagged by " + i.by : ""}${i.flagged_at ? " " + whenTime(i.flagged_at) : ""}`,
      right: act("Restocked", "ghost", async () => { await rpc("inventory_save", { p: { action: "set_status", id: i.id, status: "ok" } }); return rpc("owner_updates"); }) })).map((x) => { const w = el("div", "list-card"); w.append(x); w.style.marginBottom = "8px"; return w; }), "Nothing flagged.");
    shell(parts);
  }

  // ---------- inventory ----------
  async function renderInventory() {
    const head = [el("h2", null, "Inventory"), el("p", "note", "What's on each truck and in the yard. Crew can flag items as low from their app.")];
    shell([...head, el("p", "mono", "Loading…")]);
    let inv; try { inv = await rpc("owner_inventory"); } catch (e) { return renderFatal(friendly(e)); }
    drawInventory(head, inv);
  }
  function drawInventory(head, inv) {
    const parts = [...head];
    const run = async (p, done) => { try { drawInventory(head, await rpc("inventory_save", { p })); if (done) toast(done); } catch (e) { toast(friendly(e)); } };
    inv.forEach((l) => {
      const c = el("section", "card"); const h = el("div", "spread"); h.append(el("h3", null, l.name + (l.kind === "truck" ? " · truck" : l.kind === "yard" ? " · yard" : "")));
      const rm = btn("Remove place", "ghost small", () => { if (rm.dataset.sure !== "1") { rm.dataset.sure = "1"; rm.textContent = "Tap again"; return; } run({ action: "remove_location", id: l.id }, "Removed"); }); h.append(rm); c.append(h);
      const list = el("div");
      if (!l.items.length) list.append(el("p", "note", "No items yet."));
      l.items.forEach((i) => {
        const row = el("div", "inv-row"); row.append(el("span", "grow", i.name));
        if (i.by && i.status !== "ok") row.append(el("span", "note", "by " + i.by));
        const seg = el("div", "seg3"); seg.setAttribute("role", "group"); seg.setAttribute("aria-label", "Stock for " + i.name);
        [["ok", "OK"], ["low", "Low"], ["out", "Out"]].forEach(([v, t]) => { const b = el("button", i.status === v ? "on" : "", t); b.type = "button"; b.setAttribute("aria-pressed", String(i.status === v)); b.addEventListener("click", () => run({ action: "set_status", id: i.id, status: v })); seg.append(b); });
        const x = el("button", "x", "×"); x.type = "button"; x.className = "round-btn"; x.style.cssText = "width:32px;height:32px;background:var(--bg)"; x.setAttribute("aria-label", "Remove " + i.name); x.addEventListener("click", () => run({ action: "remove_item", id: i.id }));
        row.append(seg, x); list.append(row);
      });
      const add = el("form", "row"); const inp = el("input"); inp.placeholder = "Add an item"; inp.setAttribute("aria-label", "New item for " + l.name);
      inp.style.cssText = "flex:1;min-width:0;border:0;background:var(--bg);border-radius:12px;padding:10px 12px;min-height:44px";
      const ab = el("button", "btn small", "Add"); ab.type = "submit"; add.append(inp, ab);
      add.addEventListener("submit", (e) => { e.preventDefault(); if (inp.value.trim()) run({ action: "add_item", location_id: l.id, name: inp.value }); });
      c.append(list, add); parts.push(c);
    });
    const nf = el("form", "card"); nf.append(el("h3", null, "Add a truck or place"));
    const g = el("div", "grid2"); const nm = field("Name", "", { placeholder: "Truck 2" }); const kind = selectField("Kind", [["truck", "Truck or van"], ["yard", "Yard or shop"], ["other", "Other"]], "truck"); g.append(nm, kind);
    const s = el("button", "btn", "Add"); s.type = "submit"; const r = el("div", "row"); r.append(s); nf.append(g, r);
    nf.addEventListener("submit", (e) => { e.preventDefault(); run({ action: "add_location", name: nm.input.value, kind: kind.input.value }, "Added"); });
    if (!inv.length) parts.push(el("p", "note", "No trucks or places yet. Add one below, or your crew can create one when they flag something."));
    parts.push(nf);
    shell(parts);
  }

  route();
})();
</script>
