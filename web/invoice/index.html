<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your invoice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
@font-face { font-family: "Archivo Expanded"; src: url("/fonts/archivo-expanded-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Archivo Expanded"; src: url("/fonts/archivo-expanded-800.woff2") format("woff2"); font-weight: 800; font-display: swap; }

/* An invoice is a paper document: one light sheet, branded by the contractor's colour, with the payment panel below it. */
:root {
  --desk: #eef1ef; --paper: #ffffff; --ink: #18211c; --muted: #5d6b63; --faint: #8d9a93; --rule: #e1e7e3;
  --brand: #1d7350; --brand-ink: #ffffff; --good: #1d7350; --good-soft: #e2f2ea; --warn: #9a5a12; --warn-soft: #fbefdc; --crit: #a83229; --crit-soft: #fbe6e3;
  --display: "Archivo Expanded", Archivo, system-ui, sans-serif;
  --body: Archivo, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--desk); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.wrap { max-width: 820px; margin: 0 auto; padding-block: 24px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.sheet { background: var(--paper); border-radius: 14px; box-shadow: 0 1px 2px rgba(20,32,25,.06), 0 8px 28px rgba(20,32,25,.07); overflow: hidden; }
.band { height: 8px; background: var(--brand); }
.inner { padding: 28px clamp(18px, 4vw, 40px) 32px; display: flex; flex-direction: column; gap: 24px; }
.head { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
.who { display: flex; gap: 14px; align-items: center; min-width: 0; }
.logo { width: 64px; height: 64px; border-radius: 12px; object-fit: contain; background: #fff; border: 1px solid var(--rule); flex: none; }
.mono { width: 64px; height: 64px; border-radius: 12px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font: 700 1.5rem var(--display); flex: none; }
.biz { font: 700 1.35rem/1.15 var(--display); margin: 0; letter-spacing: -.01em; }
.contact { color: var(--muted); font-size: .8125rem; line-height: 1.45; }
.doc-title { text-align: right; }
.doc-title .kind { font: 700 .75rem var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--brand-text, var(--brand)); }
.doc-title .ref { font: 700 1.6rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px 24px; padding: 16px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.meta dt { font-size: .6875rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.meta dd { margin: 2px 0 0; font-weight: 500; overflow-wrap: anywhere; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: .6875rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding: 0 8px 8px; border-bottom: 1.5px solid var(--ink); }
td { padding: 12px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th:first-child, td:first-child { padding-left: 0; } th:last-child, td:last-child { padding-right: 0; }
.num { text-align: right; white-space: nowrap; }
td .grp, td .mob { display: block; font-size: .75rem; color: var(--faint); }
td .mob { display: none; font-size: .8125rem; color: var(--muted); }
@media (max-width: 560px) { .c-qty, .c-rate { display: none; } td .mob { display: block; } }
.totals { margin-left: auto; width: min(100%, 320px); display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-variant-numeric: tabular-nums; }
.totals .grand { font: 700 1.25rem var(--display); padding-top: 8px; border-top: 1.5px solid var(--ink); }
.totals .dep { color: var(--brand-text, var(--brand)); font-weight: 700; }
.notes { background: var(--desk); border-radius: 10px; padding: 14px 16px; white-space: pre-wrap; }
.small { font-size: .8125rem; color: var(--muted); }
.fine { font-size: .75rem; color: var(--faint); display: flex; flex-direction: column; gap: 4px; }
.panel { background: var(--paper); border-radius: 14px; padding: 22px clamp(18px, 4vw, 32px); display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(20,32,25,.06); }
.panel h2 { font: 700 1.25rem var(--display); margin: 0; }
.dates { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.date { border: 1.5px solid var(--rule); background: #fff; border-radius: 12px; padding: 12px; cursor: pointer; text-align: left; display: flex; flex-direction: column; }
.date b { font: 700 1.05rem var(--display); }
.date span { font-size: .8125rem; color: var(--muted); }
.date[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
textarea { width: 100%; border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; min-height: 70px; resize: vertical; background: #fff; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--rule); background: #fff; border-radius: 11px; padding: 12px 18px; font-weight: 700; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.link { border: 0; background: none; padding: 6px 0; color: var(--muted); text-decoration: underline; font-weight: 600; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn:focus-visible, .date:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.err { color: var(--crit); font-size: .875rem; min-height: 1.2em; }
.state { border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.state.good { background: var(--good-soft); } .state.warn { background: var(--warn-soft); } .state.crit { background: var(--crit-soft); }
.state h2 { font: 700 1.15rem var(--display); margin: 0; }
.center { min-height: 70vh; display: grid; place-items: center; text-align: center; }
.by { text-align: center; font-size: .75rem; color: var(--faint); }
.by a { color: inherit; }
@media (max-width: 560px) { .doc-title { text-align: left; } }
.stamp { display: inline-block; margin-top: 6px; border: 2px solid var(--good); color: var(--good); border-radius: 8px; padding: 2px 10px; font: 700 .8125rem var(--body); letter-spacing: .12em; text-transform: uppercase; }
.totals .due { font: 700 1.25rem var(--display); color: var(--brand); }
.ways { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 10px; }
.way { border: 1px solid var(--rule); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.way h3 { font: 700 1rem var(--display); margin: 0; }
.copyline { display: flex; gap: 8px; align-items: center; background: var(--desk); border-radius: 8px; padding: 6px 6px 6px 10px; }
.copyline code { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: .875rem; }
.copyline button { border: 1px solid var(--rule); background: #fff; border-radius: 8px; padding: 4px 10px; font-weight: 600; cursor: pointer; font-size: .8125rem; }
@media print {
  body { background: #fff; }
  .wrap { padding: 0; max-width: none; }
  .sheet { box-shadow: none; border-radius: 0; }
  .panel, .no-print { display: none !important; }
  .band { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<main class="wrap" id="root"><div class="center"><p class="small">Loading your invoice…</p></div></main>
<script>
(() => {
  const API = "https://cskcmpayxaqyqlqhepup.supabase.co/rest/v1/rpc/";
  const KEY = "sb_publishable_kScNmyqH2eLLh24O2czVYA_pViZ08DL"; // public key; access is enforced by the database
  const root = document.getElementById("root");
  const token = location.hash.slice(1).replace(/[^a-f0-9]/gi, "");
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const money = (c) => "$" + ((c || 0) / 100).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const qty = (n) => Number(n).toLocaleString("en-CA", { maximumFractionDigits: 2 });
  const dshort = (d) => new Date(d).toLocaleDateString("en-CA", { month: "short", day: "numeric", year: "numeric", timeZone: "America/Vancouver" });
  const phone = (p) => { const d = String(p || "").replace(/\D/g, "").replace(/^1(?=\d{10}$)/, ""); return d.length === 10 ? `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}` : p; };

  async function call(fn, body) {
    const r = await fetch(API + fn, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error("Couldn't reach the server. Check your connection and try again.");
    return r.json();
  }
  function fatal(title, msg) {
    root.replaceChildren();
    const c = el("div", "center"); const b = el("div");
    b.append(el("h1", null, title), el("p", "small", msg));
    b.firstChild.style.cssText = "font:700 1.5rem var(--display);margin:0 0 6px";
    c.append(b); root.append(c);
  }
  async function load() {
    if (token.length < 32) return fatal("This link isn't complete", "Open the invoice from the message again, or ask for a new link.");
    let d;
    try { d = await call("invoice_public", { p_token: token }); } catch (e) { return fatal("Couldn't load your invoice", e.message); }
    if (!d || !d.ok) return fatal("Invoice not found", "This link may be old. Ask the business that sent it for a fresh one.");
    render(d);
  }
  function copyLine(text, label) {
    const w = el("div", "copyline"); const c = el("code", null, text); const b = el("button", null, "Copy"); b.type = "button"; b.setAttribute("aria-label", "Copy " + label);
    b.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(text); b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1500); }
      catch { const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    });
    w.append(c, b); return w;
  }

  function render(d) {
    const v = d.invoice, k = d.contractor, pay = d.pay || {}; const own = !!(d.job && d.job.own);
    if (k.color && /^#[0-9a-f]{6}$/i.test(k.color)) {
      document.documentElement.style.setProperty("--brand", k.color);
      const [r, g, b] = [1, 3, 5].map((i) => parseInt(k.color.slice(i, i + 2), 16));
      if ((r * 299 + g * 587 + b * 114) / 1000 > 160) { document.documentElement.style.setProperty("--brand-ink", "#18211c"); document.documentElement.style.setProperty("--brand-text", `color-mix(in srgb, ${k.color} 55%, #000)`); }
    }
    const paid = v.status === "paid";
    document.title = `${paid ? "Receipt" : "Invoice"} ${v.number} · ${k.name}`;
    root.replaceChildren();

    const sheet = el("article", "sheet"); sheet.append(el("div", "band"));
    const inner = el("div", "inner"); sheet.append(inner);
    const head = el("div", "head");
    const who = el("div", "who");
    const mono = () => el("div", "mono", (k.name || "?").trim().charAt(0).toUpperCase());
    if (k.logo_url) { const img = el("img", "logo"); img.src = k.logo_url; img.alt = k.name + " logo"; img.onerror = () => img.replaceWith(mono()); who.append(img); } else who.append(mono());
    const wt = el("div"); wt.style.minWidth = "0"; wt.append(el("h1", "biz", k.name));
    const contact = [k.legal_name && k.legal_name !== k.name ? k.legal_name : null, k.address, [k.phone && phone(k.phone), k.email].filter(Boolean).join(" · "), k.website].filter(Boolean);
    const ct = el("div", "contact"); contact.forEach((line) => ct.append(el("div", null, line))); wt.append(ct); who.append(wt);
    const dt = el("div", "doc-title"); dt.append(el("div", "kind", "Invoice"), el("div", "ref", v.number));
    if (paid) dt.append(el("div", "stamp", "Paid"));
    head.append(who, dt); inner.append(head);

    const meta = el("dl", "meta");
    const m = (a, b) => { if (!b) return; const w = el("div"); w.append(el("dt", null, a), el("dd", null, b)); meta.append(w); };
    m("Billed to", d.customer.name + (d.customer.company ? ", " + d.customer.company : ""));
    m("Property", d.property.address);
    m("Service", d.job.service + " · " + d.job.ref);
    m("Invoice date", v.issued_at ? dshort(v.issued_at) : "");
    m("Due", paid ? "Paid" : "On receipt");
    inner.append(meta);

    const tw = el("div", "tbl-wrap"); const t = el("table");
    t.innerHTML = '<thead><tr><th>Item</th><th class="num c-qty">Qty</th><th class="num c-rate">Rate</th><th class="num">Amount</th></tr></thead>';
    const tb = el("tbody");
    (v.lines || []).forEach((l) => {
      const tr = el("tr");
      const c1 = el("td"); c1.append(el("span", null, l.description)); if (l.is_extra) c1.append(el("span", "grp", "Additional work"));
      c1.append(el("span", "mob", `${qty(l.quantity)} × ${money(l.unit_price_cents)}`));
      tr.append(c1, el("td", "num c-qty", qty(l.quantity)), el("td", "num c-rate", money(l.unit_price_cents)), el("td", "num", money(l.amount_cents)));
      tb.append(tr);
    });
    t.append(tb); tw.append(t); inner.append(tw);

    const tot = el("div", "totals");
    const tl = (a, b, cls) => { tot.append(el("div", cls, a), el("div", "num " + (cls || ""), b)); };
    tl("Subtotal", money(v.subtotal_cents));
    tl(`GST (${v.subtotal_cents ? Math.round(v.gst_cents / v.subtotal_cents * 100) : 5}%)`, money(v.gst_cents));
    tl("Total", money(v.total_cents), "grand");
    if (v.deposit_cents > 0) tl("Deposit paid", "−" + money(v.deposit_cents));
    tl(paid ? "Balance" : "Amount due", money(v.due_cents), "due");
    inner.append(tot);

    if (v.notes) { const n = el("div"); n.append(el("div", "small", "Notes"), el("div", "notes", v.notes)); n.style.cssText = "display:flex;flex-direction:column;gap:6px"; inner.append(n); }
    const fine = el("div", "fine");
    if (k.gst_number) fine.append(el("div", null, "GST registration " + k.gst_number));
    fine.append(el("div", null, "Amounts in Canadian dollars."));
    if (pay.collected_by) fine.append(el("div", null, `Payment is collected by ${pay.collected_by} on behalf of ${k.legal_name || k.name}.`));
    if (k.terms) fine.append(el("div", null, k.terms));
    if (k.footer) fine.append(el("div", null, k.footer));
    inner.append(fine);

    const panel = el("section", "panel");
    if (paid) {
      const s = el("div", "state good"); s.append(el("h2", null, "Paid in full. Thank you!"), el("p", "small", v.paid_by === "cash" ? "Paid in cash to " + k.name + "." : "We've received your payment.")); panel.append(s);
    } else {
      panel.append(el("h2", null, `Pay ${money(v.due_cents)}`));
      const ways = el("div", "ways");
      if (pay.card_url) {
        const w = el("div", "way"); w.append(el("h3", null, "Card"), el("p", "small", "Pay securely online."));
        const a = el("a", "btn primary", "Pay by card"); a.href = pay.card_url; a.target = "_blank"; a.rel = "noopener"; w.append(a); ways.append(w);
      }
      if (pay.interac_email) {
        const w = el("div", "way"); w.append(el("h3", null, "Interac e-Transfer"), el("p", "small", "Send to this email:"), copyLine(pay.interac_email, "email"),
          el("p", "small", "Put this in the message so we match it to your job:"), copyLine(pay.reference, "reference"));
        ways.append(w);
      }
      if (pay.instructions) { const w = el("div", "way"); w.append(el("h3", null, "How to pay"), el("p", "small", pay.instructions)); ways.append(w); }
      if (ways.children.length) panel.append(ways);
      else panel.append(el("p", "small", own ? `Contact ${k.name}${k.phone ? " at " + phone(k.phone) : k.email ? " at " + k.email : ""} about payment.` : "Sparrow will message you on WhatsApp with how to pay. Reply there if you have any questions."));
    }
    const tools = el("div", "row no-print");
    const dl = el("button", "btn", "Download or print"); dl.type = "button";
    dl.addEventListener("click", () => window.print());
    tools.append(dl, el("span", "small", "Choose “Save as PDF” to keep a copy."));
    panel.append(tools);
    const by = el("p", "by no-print"); by.append(own ? "Sent with Sparrow Pros · " : "Sent through Sparrow · ");
    const a = el("a", null, own ? "pros.sparrowlabs.ca" : "sparrowlabs.ca"); a.href = own ? "https://pros.sparrowlabs.ca" : "https://sparrowlabs.ca"; by.append(a);
    root.append(sheet, panel, by);
  }

  addEventListener("hashchange", () => location.reload());
  load();
})();
</script>
</body>
</html>
