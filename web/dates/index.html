<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Pick a new date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* One card: who is asking, why, and the days to pick from. Branded by the contractor's colour. */
:root {
  --desk: #eef1ef; --paper: #ffffff; --ink: #18211c; --muted: #5d6b63; --faint: #8d9a93; --rule: #e1e7e3;
  --brand: #1d7350; --brand-ink: #ffffff; --good-soft: #e2f2ea; --warn-soft: #fbefdc; --crit: #a83229;
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--desk); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, textarea { font: inherit; color: inherit; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet { background: var(--paper); border-radius: 14px; box-shadow: 0 1px 2px rgba(20,32,25,.06), 0 8px 28px rgba(20,32,25,.07); overflow: hidden; }
.band { height: 8px; background: var(--brand); }
.inner { padding: 24px clamp(18px, 5vw, 32px) 28px; display: flex; flex-direction: column; gap: 18px; }
.who { display: flex; gap: 12px; align-items: center; }
.logo { width: 52px; height: 52px; border-radius: 12px; object-fit: contain; border: 1px solid var(--rule); background: #fff; flex: none; }
.mono { width: 52px; height: 52px; border-radius: 12px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font: 700 1.3rem var(--display); flex: none; }
.biz { font: 700 1.15rem var(--display); margin: 0; }
.small { font-size: .8125rem; color: var(--muted); }
h1 { font: 700 1.5rem/1.15 var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.note { background: var(--desk); border-radius: 10px; padding: 12px 14px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: .9375rem; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; overflow-wrap: anywhere; }
.dates { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.date { border: 1.5px solid var(--rule); background: #fff; border-radius: 12px; padding: 12px; cursor: pointer; text-align: left; display: flex; flex-direction: column; }
.date b { font: 700 1.05rem var(--display); } .date span { font-size: .8125rem; color: var(--muted); }
.date[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); }
textarea { width: 100%; border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; min-height: 64px; resize: vertical; background: #fff; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--rule); background: #fff; border-radius: 11px; padding: 12px 18px; font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.link { border: 0; background: none; padding: 6px 0; color: var(--muted); text-decoration: underline; font-weight: 600; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn:focus-visible, .date:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.err { color: var(--crit); font-size: .875rem; min-height: 1.2em; }
.state { border-radius: 12px; padding: 14px 16px; }
.state.good { background: var(--good-soft); } .state.warn { background: var(--warn-soft); }
.state h2 { font: 700 1.15rem var(--display); margin: 0 0 4px; }
.center { min-height: 60vh; display: grid; place-items: center; text-align: center; }
.by { text-align: center; font-size: .75rem; color: var(--faint); }
.by a { color: inherit; }
</style>
</head>
<body>
<main class="wrap" id="root"><div class="center"><p class="small">Loading…</p></div></main>
<script>
(() => {
  const API = "https://cskcmpayxaqyqlqhepup.supabase.co/rest/v1/rpc/";
  const KEY = "sb_publishable_kScNmyqH2eLLh24O2czVYA_pViZ08DL"; // public key; access is enforced by the database
  const root = document.getElementById("root");
  const token = location.hash.slice(1).replace(/[^a-f0-9]/gi, "");
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const dlong = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-CA", { weekday: "long", month: "long", day: "numeric" });
  async function call(fn, body) {
    const r = await fetch(API + fn, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error("Couldn't reach the server. Check your connection and try again.");
    return r.json();
  }
  function fatal(title, msg) {
    root.replaceChildren(); const c = el("div", "center"); const b = el("div");
    const h = el("h1", null, title); b.append(h, el("p", "small", msg)); c.append(b); root.append(c);
  }
  async function load() {
    if (token.length < 32) return fatal("This link isn't complete", "Open it from the WhatsApp message again.");
    let d; try { d = await call("date_request_public", { p_token: token }); } catch (e) { return fatal("Couldn't load this page", e.message); }
    if (!d || !d.ok) return fatal("Link not found", "This link may be old. Message Sparrow on WhatsApp for help.");
    render(d);
  }
  function render(d) {
    const k = d.contractor;
    if (k.color && /^#[0-9a-f]{6}$/i.test(k.color)) document.documentElement.style.setProperty("--brand", k.color);
    root.replaceChildren();
    const sheet = el("article", "sheet"); sheet.append(el("div", "band"));
    const inner = el("div", "inner"); sheet.append(inner);
    const who = el("div", "who");
    if (k.logo_url) { const i = el("img", "logo"); i.src = k.logo_url; i.alt = k.name + " logo"; i.onerror = () => i.replaceWith(el("div", "mono", k.name.charAt(0))); who.append(i); } else who.append(el("div", "mono", (k.name || "?").charAt(0)));
    const wt = el("div"); wt.append(el("p", "biz", k.name), el("div", "small", `${d.job.service} · ${d.job.ref}`)); who.append(wt);
    inner.append(who);

    if (d.status === "answered") {
      const s = el("div", "state good"); s.append(el("h2", null, "Thanks, you're all set"), el("p", null, `${k.name} will come on ${dlong(d.chosen_date)}. They'll confirm the time with you.`)); inner.append(s);
    } else if (d.status === "none_work") {
      const s = el("div", "state warn"); s.append(el("h2", null, "Got it"), el("p", null, "None of those days work. Sparrow will message you on WhatsApp to find a day that does.")); inner.append(s);
    } else if (d.status === "withdrawn") {
      const s = el("div", "state warn"); s.append(el("h2", null, "This request was replaced"), el("p", null, "Open the latest message from Sparrow on WhatsApp.")); inner.append(s);
    } else {
      inner.append(el("h1", null, `${d.customer.first_name ? d.customer.first_name + ", can" : "Can"} we move your ${d.job.service.toLowerCase()}?`));
      const facts = el("dl", "facts");
      [["Booked for", d.job.current_day ? dlong(d.job.current_day) : "Not set"], ["Address", d.job.address]].forEach(([a, b]) => facts.append(el("dt", null, a), el("dd", null, b)));
      inner.append(facts);
      if (d.note) { const n = el("div", "note"); n.append(el("div", "small", `Note from ${k.name}`), el("div", null, d.note)); inner.append(n); }
      inner.append(el("p", "small", "Pick the day that suits you. Your job moves to that day."));
      let chosen = null;
      const dates = el("div", "dates"); dates.setAttribute("role", "group"); dates.setAttribute("aria-label", "New dates");
      d.dates.forEach((iso) => {
        const b = el("button", "date"); b.type = "button"; b.setAttribute("aria-pressed", "false");
        const dd = new Date(iso + "T12:00:00");
        b.append(el("b", null, dd.toLocaleDateString("en-CA", { weekday: "long" })), el("span", null, dd.toLocaleDateString("en-CA", { month: "long", day: "numeric" })));
        b.addEventListener("click", () => { chosen = iso; [...dates.children].forEach((x) => x.setAttribute("aria-pressed", String(x === b))); err.textContent = ""; });
        dates.append(b);
      });
      if (d.dates.length === 1) { chosen = d.dates[0]; dates.firstChild.setAttribute("aria-pressed", "true"); }
      const lab = el("label", "small", "Anything to add? (optional)"); lab.htmlFor = "note";
      const note = el("textarea"); note.id = "note"; note.maxLength = 500;
      const err = el("div", "err");
      const ok = el("button", "btn primary", "Confirm this day"); ok.type = "button";
      const none = el("button", "btn link", "None of these work"); none.type = "button";
      const row = el("div", "row"); row.append(ok, none);
      inner.append(dates, lab, note, row, err);
      ok.addEventListener("click", async () => {
        if (!chosen) return (err.textContent = "Pick a day first.");
        ok.disabled = true; err.textContent = "";
        try { const r = await call("date_request_respond", { p_token: token, p_action: "pick", p_date: chosen, p_note: note.value || null }); if (!r.ok) throw new Error(r.message); load(); }
        catch (e) { err.textContent = e.message; ok.disabled = false; }
      });
      none.addEventListener("click", async () => {
        if (none.dataset.armed !== "1") { none.dataset.armed = "1"; none.textContent = "Yes, none of these work"; lab.textContent = "Which days or times would suit you? (optional)"; note.focus(); return; }
        none.disabled = true;
        try { const r = await call("date_request_respond", { p_token: token, p_action: "none", p_note: note.value || null }); if (!r.ok) throw new Error(r.message); load(); }
        catch (e) { err.textContent = e.message; none.disabled = false; }
      });
    }
    const by = el("p", "by"); by.append("Sent through Sparrow · "); const a = el("a", null, "sparrowlabs.ca"); a.href = "https://sparrowlabs.ca"; by.append(a);
    root.append(sheet, by);
  }
  addEventListener("hashchange", () => location.reload());
  load();
})();
</script>
</body>
</html>
